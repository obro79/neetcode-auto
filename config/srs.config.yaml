timezone: America/Vancouver

catalog:
  path: data/neetcode_250.json

daily_set:
  review_count: 4
  focused_new_count: 2
  random_new_count: 2
  excluded_patterns:
    - Linked List
    - 2-D Dynamic Programming
  focus_pattern_order:
    - Advanced Graphs
    - Math & Geometry
    - Greedy
    - Tries

srs:
  stages: [new, 1d, 3d, 7d, 14d, 30d, mastered]
  intervals_days:
    1d: 1
    3d: 3
    7d: 7
    14d: 14
    30d: 30
  struggling_interval_days: 1

email:
  to: owenfisher46@gmail.com
  from: "NeetCode SRS <onboarding@resend.dev>"
  anchor_time: "07:00"
  backoff_minutes: [0, 30, 90, 210]
  max_attempts_per_day: 4

extension:
  sync_only_daily_set: false

